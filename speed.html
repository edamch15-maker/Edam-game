
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Speed Race | EDAM GAMES</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101925;color:white;font-family:system-ui,Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.glass{background:#061323bb;border:1px solid #74b8ff55;backdrop-filter:blur(12px);padding:12px;border-radius:13px;box-shadow:0 8px 30px #0005}
.brand{font-weight:900;color:#60c9ff;letter-spacing:1px}
#speed{font-size:32px;font-weight:900}
small{font-size:12px;color:#d5e8f8}
button,select{color:white;background:#123f67;border:1px solid #68baff;border-radius:9px;padding:10px;font-weight:700;cursor:pointer}
#actions{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#mobile{display:none;position:fixed;bottom:15px;left:14px;right:14px;justify-content:space-between;direction:ltr;pointer-events:none}
.cluster{display:flex;gap:8px;align-items:end}
.pad{pointer-events:auto;width:66px;height:69px;font-size:23px;background:#092f54d9;touch-action:none;user-select:none}
.pad.on{background:#178de9}
#startscreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#07101bea,#123b5bee);z-index:20;text-align:center;padding:20px}
#startscreen h1{font-size:clamp(35px,7vw,75px);margin:10px;color:#59c9ff}
#startscreen p{max-width:560px;line-height:1.7}
#start{padding:16px 38px;font-size:20px;background:#087de0}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;text-align:center;background:#061323aa;padding:8px 14px;border-radius:9px;pointer-events:none}
@media(pointer:coarse){
#mobile{display:flex}
#hint{bottom:98px}
#speed{font-size:25px}
.glass{padding:8px}
#actions button,#actions select{padding:7px;font-size:12px}
}
</style>
</head>
<body>
<div id="startscreen">
<div class="brand">EDAM GAMES PRESENTS</div>
<h1>SPEED RACE</h1>
<p>قيادة ثلاثية الأبعاد في مدينة واسعة مع إضاءة سينمائية، انعكاسات زجاجية، حركة مرور وكاميرتين. تحتاج اتصال إنترنت لتحميل المحرك.</p>
<p id="status">جاري تجهيز المدينة...</p>
<button id="start" disabled>انتظر التحميل...</button>
</div>
<div id="hud">
<div class="glass">
<div class="brand">SPEED RACE 3D</div>
<div id="speed">0 <small>KM/H</small></div>
<small id="distance">المسافة 0 م</small>
</div>
<div class="glass" id="actions">
<button id="camera">📷 كاميرا C</button>
<button id="reset">↻ إعادة R</button>
<select id="quality" aria-label="جودة الرسومات">
<option value="high">جودة عالية</option>
<option value="medium">متوسطة</option>
<option value="low">منخفضة</option>
</select>
</div>
</div>
<div id="hint">WASD أو الأسهم للقيادة • C تغيير الكاميرا • R إعادة • Space فرامل اليد</div>
<div id="mobile">
<div class="cluster">
<button class="pad" data-key="left">◀</button>
<button class="pad" data-key="right">▶</button>
</div>
<div class="cluster">
<button class="pad" data-key="handbrake">●</button>
<button class="pad" data-key="brake">▼</button>
<button class="pad" data-key="gas">▲</button>
</div>
</div>
<script type="module">
let THREE;
try {
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
  } catch (e) {
    THREE = await import('https://unpkg.com/three@0.160.1/build/three.module.js');
  }
} catch (e) {
  document.getElementById('status').textContent='تعذر تحميل محرك 3D. تأكد من اتصال الإنترنت أو جرّب متصفح Chrome.';
  document.getElementById('start').textContent='إعادة المحاولة';
  document.getElementById('start').disabled=false;
  document.getElementById('start').onclick=()=>location.reload();
  throw e;
}
try {
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b9d6);
scene.fog=new THREE.FogExp2(0x9bb8ca,.0017);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.22;
document.body.prepend(renderer.domElement);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1600);
const ambient=new THREE.HemisphereLight(0xeaf4ff,0x45515c,2.25);
scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffe6b8,3.6);
sun.position.set(-130,210,-180);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-240;
sun.shadow.camera.right=240;
sun.shadow.camera.top=240;
sun.shadow.camera.bottom=-240;
sun.shadow.normalBias=.035;
scene.add(sun);

const M=(c,r=1,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:metal});
const asphalt=M(0x343b41,.98),concrete=M(0x9a9c99),grass=M(0x52734e),line=M(0xe7e3d5),yellow=M(0xe9bd56),dark=M(0x111820,.65),chrome=M(0xc6d0d8,.2,.86),rubber=M(0x151719),light=M(0xfff1c4,.22);
const redLight=new THREE.MeshStandardMaterial({color:0xf31a24,emissive:0xf00015,emissiveIntensity:1.8});
const glass=new THREE.MeshPhysicalMaterial({color:0x3e7898,roughness:.09,metalness:.12,transparent:true,opacity:.7,clearcoat:1});

function box(w,h,d,mat,x=0,y=0,z=0,parent=scene,shadow=true){
const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
mesh.position.set(x,y,z);mesh.castShadow=shadow;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function plane(w,d,mat,x=0,y=0,z=0){
const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
mesh.rotation.x=-Math.PI/2;mesh.position.set(x,y,z);mesh.receiveShadow=true;scene.add(mesh);return mesh;
}
let seed=97231;
const rnd=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
const choose=a=>a[Math.floor(rnd()*a.length)];

plane(1600,1600,grass);
const roads=[];
for(let i=-4;i<=4;i++)roads.push(i*110);
for(const p of roads){
plane(26,1600,asphalt,p,.012);
plane(1600,26,asphalt,0,.014,p);
for(const s of [-1,1]){
plane(3,1600,concrete,p+s*14.5,.032);
plane(1600,3,concrete,0,.034,p+s*14.5);
}
for(let q=-490;q<=490;q+=22){
if(Math.abs(q%110)<17)continue;
box(.2,.02,7,yellow,p,.052,q,scene,false);
box(7,.02,.2,yellow,q,.054,p,scene,false);
}
for(const q of roads){
for(let k=-5;k<=5;k++){
box(1.05,.02,.42,line,p+k*1.65,.061,q-10,scene,false);
box(.42,.02,1.05,line,p-10,.063,q+k*1.65,scene,false);
}
}
}

const buildingMats=[M(0x82909a,.8),M(0xa6a59e,.83),M(0x63798a,.62),M(0xaaa08e,.8),M(0x586775,.72),M(0xc1b6a5,.86)];
const windowMat=new THREE.MeshStandardMaterial({color:0x527c98,roughness:.2,metalness:.62,emissive:0x152d3d,emissiveIntensity:.25});
const windowGeo=new THREE.PlaneGeometry(1,1);
const windows=[];
const temp=new THREE.Object3D();
function addWindow(x,y,z,rot,sx,sy){windows.push([x,y,z,rot,sx,sy]);}
function building(x,z,w,d,h){
const base=choose(buildingMats);
box(w,h,d,base,x,h/2,z);
box(w+.65,.7,d+.65,M(0x414a52),x,h+.35,z);
if(h>48)box(w*.4,2,d*.35,M(0x3b464e),x,h+1.7,z);
const nx=Math.max(2,Math.floor(w/3.7)),nz=Math.max(2,Math.floor(d/3.7)),floors=Math.floor(h/4.2);
for(let f=0;f<floors;f++){
let y=2.8+f*4.2;
for(let k=0;k<nx;k++){
const xx=x-w/2+(k+.5)*w/nx;
addWindow(xx,y,z+d/2+.06,0,1.7,2);
addWindow(xx,y,z-d/2-.06,Math.PI,1.7,2);
}
for(let k=0;k<nz;k++){
const zz=z-d/2+(k+.5)*d/nz;
addWindow(x+w/2+.06,y,zz,Math.PI/2,1.7,2);
addWindow(x-w/2-.06,y,zz,-Math.PI/2,1.7,2);
}
}
}
for(let i=-4;i<4;i++)for(let j=-4;j<4;j++){
const cx=i*110+55,cz=j*110+55;
for(let a=0;a<2;a++)for(let b=0;b<2;b++){
if(rnd()<.14)continue;
let x=cx+(a-.5)*43,z=cz+(b-.5)*43;
const center=Math.max(0,1-Math.hypot(x,z)/700);
building(x,z,18+rnd()*13,18+rnd()*13,17+rnd()*(55+center*90));
}
}
const windowMesh=new THREE.InstancedMesh(windowGeo,windowMat,windows.length);
windows.forEach((v,i)=>{
temp.position.set(v[0],v[1],v[2]);
temp.rotation.set(0,v[3],0);
temp.scale.set(v[4],v[5],1);
temp.updateMatrix();
windowMesh.setMatrixAt(i,temp.matrix);
});
windowMesh.instanceMatrix.needsUpdate=true;
scene.add(windowMesh);

const trunkGeo=new THREE.CylinderGeometry(.3,.42,3.7,7);
const leafGeo=new THREE.IcosahedronGeometry(3.1,1);
const trunkMat=M(0x69533e),leafMat=M(0x3c7550);
function tree(x,z){
const t=new THREE.Mesh(trunkGeo,trunkMat);
t.position.set(x,1.85,z);scene.add(t);
const l=new THREE.Mesh(leafGeo,leafMat);
l.position.set(x,5,z);l.scale.set(1,1.2,1);l.castShadow=true;scene.add(l);
}
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){
if(rnd()<.8)tree(i*110+18,j*110+18);
}

// 3D vehicle with correctly oriented wheel assemblies.
function makeCar(color=0x087df0,interior=false){
const root=new THREE.Group(),paint=M(color,.19,.72);
box(2.25,.65,4.75,paint,0,1.12,0,root);
box(2.16,.16,4.2,paint,0,1.52,0,root);
box(1.92,.83,2.48,glass,0,2.02,-.28,root);
box(2.01,.13,2.54,paint,0,2.48,-.28,root);
box(2.18,.21,.18,dark,0,1.16,-2.39,root);
box(2.18,.21,.18,dark,0,1.16,2.39,root);
box(1.1,.12,.65,paint,0,1.7,2.12,root);
for(const x of [-1.2,1.2]){
box(.16,.13,.33,paint,x,1.85,-.7,root);
for(const z of [-1.48,1.48]){
const pivot=new THREE.Group();
pivot.position.set(x,.78,z);root.add(pivot);
const axle=new THREE.Group();
axle.rotation.z=Math.PI/2;
pivot.add(axle);
const tire=new THREE.Mesh(new THREE.CylinderGeometry(.77,.77,.37,20),rubber);
tire.castShadow=true;axle.add(tire);
const rim=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.38,12),chrome);
axle.add(rim);
root.userData.wheels??=[];
root.userData.wheels.push({pivot,axle,z});
}
}
for(const x of [-.77,.77]){
box(.52,.2,.09,light,x,1.29,-2.41,root);
box(.52,.2,.09,redLight,x,1.29,2.41,root);
}
box(1.35,.16,.13,chrome,0,.87,-2.44,root);
if(interior){
box(1.85,.2,.7,dark,0,1.67,-.95,root);
const steering=new THREE.Mesh(new THREE.TorusGeometry(.33,.05,8,20),dark);
steering.position.set(-.5,1.93,-.9);
steering.rotation.x=.48;root.add(steering);
for(const x of [-.5,.5])box(.65,.55,.65,dark,x,1.67,.5,root);
}
return root;
}

const car=makeCar(0x087df0,true);
scene.add(car);
let heading=0,speed=0,distance=0,cameraMode=0;
const controls={gas:false,brake:false,left:false,right:false,handbrake:false};
const map={KeyW:'gas',ArrowUp:'gas',KeyS:'brake',ArrowDown:'brake',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'handbrake'};
function reset(){car.position.set(0,0,42);heading=0;speed=0;}
reset();
function toggleCamera(){
cameraMode=1-cameraMode;
document.getElementById('camera').textContent=cameraMode?'🚘 داخلية C':'📷 خلفية C';
}
document.getElementById('camera').onclick=toggleCamera;
document.getElementById('reset').onclick=reset;
addEventListener('keydown',e=>{
if(map[e.code]){controls[map[e.code]]=true;e.preventDefault();}
if(e.code==='KeyC'&&!e.repeat)toggleCamera();
if(e.code==='KeyR'&&!e.repeat)reset();
});
addEventListener('keyup',e=>{if(map[e.code])controls[map[e.code]]=false;});
addEventListener('blur',()=>Object.keys(controls).forEach(k=>controls[k]=false));
document.querySelectorAll('.pad').forEach(b=>{
const k=b.dataset.key;
b.addEventListener('pointerdown',e=>{
e.preventDefault();b.setPointerCapture(e.pointerId);
controls[k]=true;b.classList.add('on');
});
const up=()=>{controls[k]=false;b.classList.remove('on');};
b.addEventListener('pointerup',up);
b.addEventListener('pointercancel',up);
b.addEventListener('lostpointercapture',up);
});

const traffic=[];
for(let i=0;i<27;i++){
const horizontal=i%2===0,lane=roads[Math.floor(rnd()*roads.length)],dir=rnd()<.5?1:-1;
const mesh=makeCar(choose([0xf5f5f5,0xd64b3b,0x31383f,0xe3b841,0x50748c]));
scene.add(mesh);
traffic.push({mesh,horizontal,lane,dir,pos:-680+rnd()*1360,velocity:10+rnd()*13});
}
function updateTraffic(dt){
for(const t of traffic){
t.pos+=t.dir*t.velocity*dt;
if(t.pos>730)t.pos=-730;
if(t.pos< -730)t.pos=730;
if(t.horizontal){
t.mesh.position.set(t.pos,0,t.lane+(t.dir>0?5:-5));
t.mesh.rotation.y=t.dir>0?-Math.PI/2:Math.PI/2;
}else{
t.mesh.position.set(t.lane+(t.dir>0?-5:5),0,t.pos);
t.mesh.rotation.y=t.dir>0?Math.PI:0;
}
const dx=t.mesh.position.x-car.position.x,dz=t.mesh.position.z-car.position.z;
if(Math.abs(dx)<2.2&&Math.abs(dz)<4){
speed*=-.22;
car.position.x-=Math.sign(dx||1)*.16;
car.position.z-=Math.sign(dz||1)*.16;
}
}
}

const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),look=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
let running=false;
function update(dt){
if(controls.gas)speed+=30*dt;
if(controls.brake)speed-=speed>1?48*dt:18*dt;
if(!controls.gas&&!controls.brake){
const drag=(controls.handbrake?19:5.5)*dt;
speed=Math.abs(speed)<drag?0:speed-Math.sign(speed)*drag;
}
speed=THREE.MathUtils.clamp(speed,-15,57);
const steer=Number(controls.right)-Number(controls.left);
if(Math.abs(speed)>.2)heading+=steer*dt*(controls.handbrake?2.15:1.22)*Math.min(Math.abs(speed)/14,1)*Math.sign(speed);
const forward=new THREE.Vector3(-Math.sin(heading),0,-Math.cos(heading));
car.position.addScaledVector(forward,speed*dt);
car.rotation.y=heading;
distance+=Math.abs(speed)*dt;
for(const w of car.userData.wheels){
w.axle.children[0].rotation.y+=speed*dt/.77;
w.axle.children[1].rotation.y+=speed*dt/.77;
w.pivot.rotation.y=w.z<0?steer*.27:0;
}
const onX=roads.some(v=>Math.abs(car.position.x-v)<15);
const onZ=roads.some(v=>Math.abs(car.position.z-v)<15);
if(!onX&&!onZ)speed*=Math.max(0,1-1.6*dt);
car.position.x=THREE.MathUtils.clamp(car.position.x,-710,710);
car.position.z=THREE.MathUtils.clamp(car.position.z,-710,710);
updateTraffic(dt);
const back=new THREE.Vector3(0,0,1).applyAxisAngle(up,heading);
if(cameraMode===0){
camTarget.copy(car.position).addScaledVector(back,10.5).add(new THREE.Vector3(0,4.6,0));
look.copy(car.position).addScaledVector(forward,8).add(new THREE.Vector3(0,1.7,0));
}else{
camTarget.copy(car.position).add(new THREE.Vector3(-.48,2.06,0)).addScaledVector(forward,.15);
look.copy(camTarget).addScaledVector(forward,30);
}
camera.position.lerp(camTarget,Math.min(1,dt*(cameraMode?14:5)));
camera.lookAt(look);
document.getElementById('speed').innerHTML=Math.round(Math.abs(speed)*3.6)+' <small>KM/H</small>';
document.getElementById('distance').textContent='المسافة '+Math.floor(distance)+' م';
}
function loop(){
requestAnimationFrame(loop);
const dt=Math.min(clock.getDelta(),.04);
if(running)update(dt);
renderer.render(scene,camera);
}
camera.position.set(0,5,53);
camera.lookAt(0,1,38);
loop();
function setQuality(v){
const scale=v==='high'?Math.min(devicePixelRatio,1.8):v==='medium'?Math.min(devicePixelRatio,1.15):.75;
renderer.setPixelRatio(scale);
renderer.shadowMap.enabled=v!=='low';
sun.castShadow=v!=='low';
sun.shadow.mapSize.set(v==='high'?2048:1024,v==='high'?2048:1024);
sun.shadow.map?.dispose();
sun.shadow.map=null;
renderer.setSize(innerWidth,innerHeight);
}
document.getElementById('quality').onchange=e=>setQuality(e.target.value);
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
const start=document.getElementById('start');
start.disabled=false;
start.textContent='ابدأ القيادة';
document.getElementById('status').textContent='المدينة جاهزة!';
start.onclick=()=>{
running=true;
document.getElementById('startscreen').style.display='none';
clock.getDelta();
};
} catch (e) {
console.error('Speed Race initialization failed:',e);
const status=document.getElementById('status');
status.textContent='حدث خطأ في تشغيل اللعبة: '+(e?.message||'خطأ غير معروف');
const start=document.getElementById('start');
start.disabled=false;
start.textContent='إعادة المحاولة';
start.onclick=()=>location.reload();
}
</script>
</body>
</html>
