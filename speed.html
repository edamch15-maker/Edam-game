<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speed Race</title>
<style>
:root{color-scheme:dark;--ink:#fff5ea;--dim:#c9a9d6;--hot:#ff2e63;--cyan:#12e5ff;--glass:rgba(18,6,36,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#12062a;overflow:hidden;color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(10,0,30,.85));opacity:0}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);direction:ltr;background:var(--glass);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 16px;min-width:150px}
#spd{font:800 56px/1 "Arial Black",Impact,sans-serif;font-style:italic;letter-spacing:-1px;text-shadow:0 0 18px var(--hot)}
#unit{font-size:12px;color:var(--dim);margin-bottom:6px}
#rpm{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--hot))}
.row{display:flex;justify-content:space-between;gap:16px;margin-top:8px;font-size:13px;color:var(--dim)}
.row b{color:var(--ink);font-size:20px}
#cam{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:var(--glass);color:var(--ink);font-size:24px}
#pad{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none;justify-content:space-between;padding:0 16px;direction:ltr}
#pad div{display:flex;gap:12px}
#pad button{width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:var(--glass);color:var(--ink);font-size:28px}
#pad button.on{background:var(--hot)}
@media (pointer:coarse){#pad{display:flex}}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(255,80,120,.35),rgba(14,4,32,.94) 70%);padding:24px}
#start h1{margin:0;font:900 clamp(44px,12vw,96px)/.95 "Arial Black",Impact,sans-serif;font-style:italic;text-shadow:0 0 30px var(--hot),0 0 60px #7a1fff}
#start p{margin:0;max-width:34ch;color:var(--dim);line-height:1.7}
#go{margin-top:8px;padding:14px 44px;font-size:20px;font-weight:700;color:#fff;border:0;border-radius:40px;background:linear-gradient(90deg,var(--hot),#ff8a3d);box-shadow:0 0 30px rgba(255,46,99,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="vig"></div>
<div id="hud"><div id="spd">0</div><div id="unit">كم/س</div><div id="rpm"><i></i></div>
<div class="row"><span>الترس <b id="gear">N</b></span><span>المسافة <b id="dist">0.00</b> كم</span></div></div>
<button id="cam" aria-label="تبديل الكاميرا">📷</button>
<div id="pad"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><button data-k="down">فرامل</button><button data-k="up">انطلق</button></div></div>
<div id="start"><h1>SPEED<br>RACE</h1>
<p>أسهم أو WASD للقيادة، المسافة للفرامل، وحرف C لتبديل الكاميرا بين الخلفية والداخلية.</p>
<button id="go">ابدأ السباق</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (!window.THREE) {
  document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\\/script>');
}
</script>
<script>
if (!window.THREE) {
  document.getElementById('start').innerHTML =
    '<h1>LOAD ERROR</h1><p>تعذّر تحميل محرك 3D. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</p>';
  throw new Error('Three.js failed to load');
}
const W=7,SEG=4,N=130,VMAX=88;
const c=s=>45*Math.sin(s*.0035)+22*Math.sin(s*.0097+1);
const dc=s=>(c(s+1)-c(s-1))/2, ddc=s=>c(s+1)-2*c(s)+c(s-1);
const cv=document.getElementById('c');
let R;
try {
  R=new THREE.WebGLRenderer({canvas:cv,antialias:true, powerPreference:"high-performance"});
} catch (err) {
  document.getElementById('start').innerHTML =
    '<h1>WEBGL ERROR</h1><p>المتصفح أو الجهاز لا يدعم WebGL. جرّب Chrome أو فعّل تسريع الرسوميات.</p>';
  throw err;
}
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
const sk=document.createElement('canvas');sk.width=4;sk.height=256;
{const x=sk.getContext('2d'),g=x.createLinearGradient(0,0,0,256);[[0,'#120536'],[.45,'#6a1b8f'],[.75,'#ff4f7b'],[1,'#ffb347']].forEach(a=>g.addColorStop(a[0],a[1]));x.fillStyle=g;x.fillRect(0,0,4,256)}
scene.background=new THREE.CanvasTexture(sk);
scene.fog=new THREE.Fog(0xb2457f,60,430);
const cam=new THREE.PerspectiveCamera(62,1,.1,1200);scene.add(cam);
scene.add(new THREE.HemisphereLight(0xffb08a,0x2a1048,1.1));
const sun=new THREE.DirectionalLight(0xffc89a,1.4);sun.position.set(-30,40,-60);scene.add(sun);

// sun disc + mountains
const sunM=new THREE.Mesh(new THREE.CircleGeometry(110,48),new THREE.MeshBasicMaterial({color:0xffc15e,fog:false}));scene.add(sunM);
const mts=[];for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(160+(i*53%90),130+(i*37%80),5),new THREE.MeshBasicMaterial({color:i%2?0x2a0f4d:0x3a1560,fog:false}));scene.add(m);mts.push(m)}

// ground + road strips
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshBasicMaterial({color:0x2a1450}));ground.rotation.x=-Math.PI/2;ground.position.y=-.05;scene.add(ground);
const AS=[[.1,.1,.12],[.12,.12,.15]],WH=[.95,.95,.95],RD=[.9,.1,.18];
function strip(x0,x1,y,cf){const n=N+1,pos=new Float32Array(n*6),col=new Float32Array(n*6),idx=[];
 for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);
 const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));m.frustumCulled=false;scene.add(m);
 return{g,pos,col,x0,x1,y,cf}}
const strips=[strip(-W,W,.02,k=>AS[k]),strip(-.12,.12,.04,k=>k?AS[1]:WH),strip(-W+.3,-W+.55,.04,()=>WH),strip(W-.55,W-.3,.04,()=>WH),strip(-W-1.2,-W,.03,k=>k?WH:RD),strip(W,W+1.2,.03,k=>k?WH:RD)];
function updRoad(base){for(const t of strips){for(let i=0;i<=N;i++){const si=(base+i)*SEG,cx=c(si),k=(base+i)&1,q=t.cf(k);
 for(let j=0;j<2;j++){const o=(i*2+j)*3;t.pos[o]=cx+(j?t.x1:t.x0);t.pos[o+1]=t.y;t.pos[o+2]=-si;t.col[o]=q[0];t.col[o+1]=q[1];t.col[o+2]=q[2]}}
 t.g.attributes.position.needsUpdate=true;t.g.attributes.color.needsUpdate=true}}

// roadside props
const ITEMS=64,GAP=15,props=[];
const treeG=new THREE.ConeGeometry(2.2,6,7),trunkG=new THREE.CylinderGeometry(.25,.3,1.5,6),poleG=new THREE.CylinderGeometry(.08,.1,7,6),lampG=new THREE.BoxGeometry(1.6,.2,.4);
const treeM=new THREE.MeshLambertMaterial({color:0x1d6b6b}),trunkM=new THREE.MeshLambertMaterial({color:0x3a2540}),poleM=new THREE.MeshLambertMaterial({color:0x33213f});
for(let i=0;i<ITEMS;i++){const g=new THREE.Group(),side=i%2?1:-1;
 if(i%4<2){const a=new THREE.Mesh(treeG,i%3?treeM:new THREE.MeshLambertMaterial({color:0xd0407f}));a.position.y=4;g.add(a);const b=new THREE.Mesh(trunkG,trunkM);b.position.y=.75;g.add(b)}
 else{const p=new THREE.Mesh(poleG,poleM);p.position.y=3.5;g.add(p);const l=new THREE.Mesh(lampG,new THREE.MeshBasicMaterial({color:i%8<4?0x12e5ff:0xff2e63}));l.position.set(-side*.8,7,0);g.add(l)}
 scene.add(g);props.push({g,side,s:i*GAP,off:W+3.5+((i*7)%5)*1.8})}

// car
const car=new THREE.Group();scene.add(car);
const paint=new THREE.MeshStandardMaterial({color:0xe3122f,metalness:.55,roughness:.28}),dark=new THREE.MeshStandardMaterial({color:0x0a0a12,metalness:.4,roughness:.4}),glass=new THREE.MeshStandardMaterial({color:0x101a2e,metalness:.8,roughness:.1});
const glow=h=>new THREE.MeshBasicMaterial({color:h});
function mk(g,m,x,y,z,p){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);(p||car).add(o);return o}
mk(new THREE.BoxGeometry(1.9,.5,4.4),paint,0,.55,0);
mk(new THREE.BoxGeometry(1.7,.25,1.5),paint,0,.8,-1.4);
mk(new THREE.BoxGeometry(1.5,.45,1.9),glass,0,1.02,.35);
mk(new THREE.BoxGeometry(1.4,.06,1.3),paint,0,1.27,.4);
mk(new THREE.BoxGeometry(1.95,.06,.5),dark,0,1.15,2.05);
mk(new THREE.BoxGeometry(.08,.4,.1),dark,-.6,.95,2.05);mk(new THREE.BoxGeometry(.08,.4,.1),dark,.6,.95,2.05);
mk(new THREE.BoxGeometry(1.95,.12,.3),dark,0,.32,-2.15);
[-.65,.65].forEach(x=>{mk(new THREE.BoxGeometry(.45,.12,.06),glow(0xfff4c8),x,.68,-2.21);mk(new THREE.BoxGeometry(.6,.1,.06),glow(0xff1030),x,.72,2.21)});
const wheels=[];[[-1,-1.45],[1,-1.45],[-1,1.45],[1,1.45]].forEach(p=>{const w=new THREE.Group();w.position.set(p[0],.4,p[1]);
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.32,20),dark);t.rotation.z=Math.PI/2;w.add(t);
 const r=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.34,10),new THREE.MeshStandardMaterial({color:0xc8c8d8,metalness:.9,roughness:.2}));r.rotation.z=Math.PI/2;w.add(r);car.add(w);wheels.push(w)});
const under=new THREE.PointLight(0x12e5ff,2,9);under.position.set(0,.15,0);car.add(under);

// cockpit
const dash=new THREE.Group();dash.visible=false;cam.add(dash);
mk(new THREE.BoxGeometry(2.4,.35,.7),dark,0,-.62,-.9,dash);
mk(new THREE.BoxGeometry(1.8,.1,3),paint,0,-.5,-2.6,dash);
const wheel=new THREE.Mesh(new THREE.TorusGeometry(.26,.035,8,24),dark);wheel.position.set(0,-.38,-.75);wheel.rotation.x=-.5;dash.add(wheel);

// controls
const K={up:0,down:0,left:0,right:0};let view=0;
const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',' ':'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
addEventListener('keydown',e=>{if(map[e.key]){K[map[e.key]]=1;e.preventDefault()}if(e.key==='c'||e.key==='C')toggleCam()});
addEventListener('keyup',e=>{if(map[e.key])K[map[e.key]]=0});
addEventListener('blur',()=>{Object.keys(K).forEach(k=>K[k]=0)});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k,on=e=>{K[k]=1;b.classList.add('on');e.preventDefault()},off=()=>{K[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off))});
function toggleCam(){view^=1;car.visible=!view;dash.visible=!!view}
document.getElementById('cam').addEventListener('click',toggleCam);

// audio
let AC,osc,flt,gn;
function audio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();osc=AC.createOscillator();osc.type='sawtooth';flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=700;gn=AC.createGain();gn.gain.value=.05;osc.connect(flt);flt.connect(gn);gn.connect(AC.destination);osc.start()}catch(e){}}

// state
let s=0,lat=0,v=0,st=0,yaw=0,running=false,shake=0;
const el={spd:document.getElementById('spd'),gear:document.getElementById('gear'),dist:document.getElementById('dist'),rpm:document.querySelector('#rpm i'),vig:document.getElementById('vig')};
document.getElementById('go').onclick=async()=>{
  document.getElementById('start').style.display='none';
  running=true;
  audio();
  if (AC && AC.state === 'suspended') { try { await AC.resume(); } catch(e) {} }
};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const V=THREE.Vector3,clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
 const off=Math.abs(lat)>W;
 if(running){let a=K.up?32*(1-v/VMAX):0;if(K.down)a-=55;a-=.0012*v*v+(v>0?1.2:0);if(off)a-=22;v=Math.max(0,v+a*dt)}
 else v*=.98;
 const tgt=(K.right-K.left);st+=(tgt-st)*Math.min(1,dt*8);
 lat+=st*Math.min(v,45)*.2*dt;lat-=ddc(s)*v*v*.5*dt;lat=Math.max(-W-10,Math.min(W+10,lat));
 s+=v*dt;
 const px=c(s)+lat,pz=-s,ty=-Math.atan(dc(s)+st*.22);yaw+=(ty-yaw)*Math.min(1,dt*7);
 car.position.set(px,0,pz);car.rotation.set(0,yaw,-st*.06*Math.min(1,v/40));
 wheels.forEach(w=>{w.rotation.x=(w.rotation.x+v*dt/.4)%(Math.PI*2)});
 // Steering pivots: only the front wheels turn left/right.
  wheels[0].rotation.y=wheels[1].rotation.y=-st*.4;
 updRoad(Math.floor(s/SEG)-10);
 ground.position.set(px,-.05,pz);
 for(const p of props){if(p.s<s-30)p.s+=ITEMS*GAP;p.g.position.set(c(p.s)+p.side*p.off,0,-p.s)}
 sunM.position.set(px-60,120,pz-950);mts.forEach((m,i)=>m.position.set(px+(i-4)*260,60,pz-900-(i%3)*40));
 const fx=-Math.sin(yaw),fz=-Math.cos(yaw);shake=(v/VMAX)*.04+(off?v*.004:0);
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
 if(!view){const d=7.5+v*.03;cam.position.set(px-fx*d+sx,3.1+sy,pz-fz*d);cam.lookAt(px+fx*14,1.3,pz+fz*14)}
 else{car.updateMatrixWorld();cam.position.copy(car.localToWorld(new V(0,1.18,.3))).add(new V(sx,sy,0));cam.lookAt(car.localToWorld(new V(0,1.1,-30)));wheel.rotation.z=-st*1.2}
 cam.fov=60+(v/VMAX)*22;cam.updateProjectionMatrix();
 const kmh=v*3.6,g=kmh<2?0:Math.min(6,1+Math.floor(kmh/53)),fr=g?(kmh-(g-1)*53)/53:0;
 el.spd.textContent=Math.round(kmh);el.gear.textContent=g||'N';el.dist.textContent=(s/1000).toFixed(2);
 el.rpm.style.width=Math.min(100,(g?30+fr*70:8))+'%';el.vig.style.opacity=(v/VMAX)*.6;
 if(osc){osc.frequency.value=45+(g?fr*85+g*14:0)+K.up*10;flt.frequency.value=500+kmh*4}
 R.render(scene,cam)}
loop();
</script>
</body>
</html>
